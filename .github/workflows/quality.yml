name: r3con quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[full,dev]'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q
      - name: Run Pyflakes
        continue-on-error: true
        run: pyflakes core cli modules tests
      - name: Run Bandit (high severity gate)
        continue-on-error: true
        # Les alertes historiques sont conservées dans les logs ; tests et build restent bloquants.
        run: bandit -q -r core cli modules -lll
      - name: Run Ruff (advisory during stabilization)
        continue-on-error: true
        run: ruff check core cli modules
      - name: Build distribution
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
