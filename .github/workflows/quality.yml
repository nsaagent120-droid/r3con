name: r3con quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[full]' pytest pyflakes bandit
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q
      - name: Run Pyflakes
        run: pyflakes core cli layers modules tests
      - name: Run Bandit (high severity gate)
        # Les alertes medium/low restent consultables avec bandit -ll en revue.
        run: bandit -q -r core cli layers modules -lll
