site_name: Carnet Système
site_description: "Recherches sur les systèmes embarqués, les kernels & OS, l'analyse de CVE et les protocoles IoT — documentées en public, un article par semaine."
site_author: <ton-pseudo>
site_url: "https://<ton-pseudo>.github.io/carnet-systeme/"

repo_name: carnet-systeme
repo_url: https://github.com/<ton-pseudo>/carnet-systeme
edit_uri: edit/main/site/docs/

copyright: © 2026 Carnet Système — contenu sous licence <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr">CC BY-SA 4.0</a>

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    # Bascule automatique + manuelle clair/sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
  icon:
    repo: fontawesome/brands/github

nav:
  - Accueil: index.md
  - Séries:
      - Kernel & OS: series/kernel-os.md
      - Embarqué & Firmware: series/embarque-firmware.md
      - CVE Analysis: series/cve-analysis.md
      - Protocoles IoT: series/protocoles-iot.md
  - Articles:
      - "Dirty COW (CVE-2016-5195)": articles/2026-09-12-dirty-cow-cve-2016-5195.md
      - "Ordonnanceur Linux — CFS": articles/2026-09-12-ordonnanceur-linux-cfs.md
      - "MQTT pour l'embarqué": articles/2026-09-12-mqtt-pour-embarque.md
  - À propos: a-propos.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: ⚓
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/<ton-pseudo>
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/<ton-pseudo>/
