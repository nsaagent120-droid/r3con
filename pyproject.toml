[build-system]
requires = ["setuptools>=68", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "r3con"
version = "7.3.0"
description = "r3con 7.3.0 stable - Offline-first, explicable, fusionnée - 49 modules, 35+ tools, 27 CLI groups, supply-chain, diff, sandbox, 121 tests - la vraie version"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["security", "binary-analysis", "reverse-engineering", "firmware", "apk", "vulnerability", "bug-bounty", "0day", "static-analysis", "malware"]
authors = [
  {name = "r3con contributors", email = "security@r3con.local"}
]
maintainers = [
  {name = "r3con maintainers", email = "security@r3con.local"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Disassemblers",
  "Topic :: System :: Networking :: Firewalls",
  "Topic :: Utilities",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Natural Language :: English",
  "Natural Language :: French",
]
dependencies = [
  "click>=8.1.0,<9.0.0",
  "rich>=13.0.0,<15.0.0",
]

[project.optional-dependencies]
# Minimal binary analysis
binary = [
  "capstone>=5.0.0",
  "lief>=0.13.0",
]
# Firmware utilities
firmware = [
  "pyyaml>=6.0",
]
# Reporting
reporting = [
  "jinja2>=3.1.0",
  "pyyaml>=6.0",
]
# Web dashboard
web = [
  "flask>=2.0.0",
  "jinja2>=3.1.0",
]
# YARA scanning
yara = [
  "yara-python>=4.5.0",
]
# AST engine (tree-sitter)
ast = [
  "tree-sitter>=0.21.0",
  "tree-sitter-c>=0.21.0",
]
# Symbolic execution
symbolic = [
  "z3-solver>=4.12.0",
]
# AI providers
ai-openai = [
  "openai>=1.3.0",
]
ai-together = [
  "together>=0.2.0",
]
ai-all = [
  "openai>=1.3.0",
  "together>=0.2.0",
]
# Full installation - everything
full = [
  "capstone>=5.0.0",
  "lief>=0.13.0",
  "pyyaml>=6.0",
  "jinja2>=3.1.0",
  "flask>=2.0.0",
  "yara-python>=4.5.0",
  "openai>=1.3.0",
  "together>=0.2.0",
  "tree-sitter>=0.21.0",
  "tree-sitter-c>=0.21.0",
  "z3-solver>=4.12.0",
]
# Dev dependencies
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.4.0",
  "black>=24.0.0",
  "mypy>=1.8.0",
  "pyflakes>=3.0.0",
  "bandit>=1.7.0",
  "build>=1.0.0",
  "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/nsaagent120-droid/r3con"
Repository = "https://github.com/nsaagent120-droid/r3con"
Issues = "https://github.com/nsaagent120-droid/r3con/issues"
Changelog = "https://github.com/nsaagent120-droid/r3con/blob/master/CHANGELOG.md"
Documentation = "https://github.com/nsaagent120-droid/r3con#readme"
Security = "https://github.com/nsaagent120-droid/r3con/blob/master/SECURITY_AUDIT.md"

[project.scripts]
r3con = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "modules*", "plugins*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt", "*.md"]

# ── Tooling configs for professional workflow ──

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", "__pycache__", "build", "dist", ".venv", "fw_extracted"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "core", "modules"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build", "dist", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["core", "cli", "modules"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
# B324 est utilisé pour des fingerprints, UUID/SARIF et JA3, jamais pour protéger un secret.
skips = ["B101", "B324", "B601"]
