[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r3con"
version = "5.0.2"
description = "Offline-first binary, source, firmware and passive network analysis toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "click>=8.1.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
full = [
  "capstone>=5.0.0",
  "lief>=0.13.0",
  "pyyaml>=6.0",
  "jinja2>=3.1.0",
  "flask>=2.0.0",
  "yara-python>=4.5.0",
  "openai>=1.3.0",
  "together>=0.2.0",
  "tree-sitter>=0.21.0",
  "tree-sitter-c>=0.21.0",
  "z3-solver>=4.12.0",
]

[project.scripts]
r3con = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "layers*", "modules*"]
